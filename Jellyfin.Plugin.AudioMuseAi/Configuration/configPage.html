<!DOCTYPE html>
<html>

<head>
    <title>AudioMuse AI</title>
</head>

<body>
    <!-- 
        This is the main page container. The classes and data-role are critical
        for Jellyfin's UI framework to recognize and handle this page correctly.
        We add a unique class 'audiomuseConfigurationPage' to target it with JavaScript.
    -->
    <div id="audiomuseConfigurationPage" data-role="page"
        class="page type-interior pluginConfigurationPage audiomuseConfigurationPage"
        data-require="emby-input,emby-select">

        <!-- The main content area -->
        <div data-role="main" class="ui-content">
            <div class="content-primary">
                <h1 class="pageTitle">AudioMuse AI</h1>

                <!-- The configuration form -->
                <form class="audiomuse-config-form">
                    <div class="formSection">
                        <h3 class="formSectionTitle">API Settings</h3>
                        <div class="formInstructions">
                            Configure the connection to your self-hosted AudioMuse AI backend.
                        </div>

                        <!-- Input for API Token -->
                        <div class="inputContainer">
                            <input is="emby-input" type="password" id="apiToken" name="apiToken"
                                label="API Token (optional):" placeholder="Leave blank if not required" />
                        </div>

                        <!-- Input for Backend URL -->
                        <div class="inputContainer">
                            <input is="emby-input" type="url" id="backendUrl" name="backendUrl"
                                label="Backend URL:" placeholder="http://127.0.0.1:8000" required />
                        </div>

                        <!-- Input for Media Server Name -->
                        <div class="inputContainer">
                            <input is="emby-input" type="text" id="serverName" name="serverName"
                                label="Media Server Name (optional):" placeholder="Leave blank to use the default server" />
                        </div>

                        <!-- Select for the similarity provider -->
                        <div class="selectContainer">
                            <select is="emby-select" id="similarityProvider" name="similarityProvider"
                                label="Similarity Provider:">
                                <option value="SimilarSong">Similar Song (default)</option>
                                <option value="LyricsBySong">Lyrics by Song</option>
                                <option value="Hyperbolic">Hyperbolic Similarity</option>
                            </select>
                        </div>
                    </div>

                    <!-- Connection test result, then the save button -->
                    <div>
                        <div id="connectionStatus" style="margin-bottom: 0.5em; padding: 0.5em; display: none; border-radius: 4px;"></div>
                        <button is="emby-button" type="submit" class="raised button-submit block">
                            <span>Save and Test Connection</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 
            CRITICAL: This script provides the ApiClient and Dashboard objects.
            It must be included for the page to work.
        -->
        <script type="text/javascript" src="/web/components/plugin.js"></script>

        <!-- Your page's custom script -->
        <script>
            (function () {
                // The unique GUID for your plugin.
                const pluginId = 'e3831be1-c025-4ebc-bc79-121ad0dfc4e1';

                // Select the page container using its unique class.
                const page = document.querySelector('.audiomuseConfigurationPage');

                // The similarity providers, in the same order as the SimilarityEngine enum,
                // so a configuration that serialises the enum numerically still resolves.
                const similarityProviders = ['SimilarSong', 'LyricsBySong', 'Hyperbolic'];

                // Falls back to the default provider for anything unrecognised, so a config
                // written by an older plugin version never leaves the select box blank.
                function normalizeProvider(value) {
                    if (typeof value === 'number') {
                        return similarityProviders[value] || 'SimilarSong';
                    }
                    const name = String(value == null ? '' : value).trim();
                    return similarityProviders.indexOf(name) >= 0 ? name : 'SimilarSong';
                }

                // Function to load configuration from the server.
                function loadConfig() {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(pluginId).then((config) => {
                        page.querySelector('#backendUrl').value = config.BackendUrl || '';
                        page.querySelector('#apiToken').value = config.ApiToken || '';
                        page.querySelector('#serverName').value = config.ServerName || '';
                        page.querySelector('#similarityProvider').value = normalizeProvider(config.SimilarityProvider);
                        Dashboard.hideLoadingMsg();
                    });
                }

                // Function to save configuration to the server.
                function saveConfig(form) {
                    Dashboard.showLoadingMsg();
                    const newConfig = {
                        BackendUrl: form.querySelector('#backendUrl').value,
                        ApiToken: form.querySelector('#apiToken').value,
                        ServerName: form.querySelector('#serverName').value,
                        SimilarityProvider: normalizeProvider(form.querySelector('#similarityProvider').value)
                    };
                    ApiClient.updatePluginConfiguration(pluginId, newConfig).then((result) => {
                        Dashboard.processPluginConfigurationUpdateResult(result);
                        // After saving, test the connection
                        testConnection();
                    });
                }

                // Function to test backend connection
                function testConnection() {
                    const backendUrl = page.querySelector('#backendUrl').value;
                    const statusDiv = page.querySelector('#connectionStatus');
                    
                    if (!backendUrl) {
                        showStatus(statusDiv, 'Please enter a Backend URL first.', 'error');
                        return;
                    }

                    Dashboard.showLoadingMsg();
                    statusDiv.style.display = 'none';

                    // Use ApiClient.ajax - if we reach .then(), status is 2xx = success
                    ApiClient.ajax({
                        type: 'POST',
                        url: '/AudioMuseAI/test_connection',
                        data: JSON.stringify(backendUrl),
                        contentType: 'application/json'
                    }).then(function(response) {
                        // Got 2xx status = success
                        Dashboard.hideLoadingMsg();
                        showStatus(statusDiv, '✓ Connection successful!', 'success');
                    }).catch(function(error) {
                        // Got non-2xx status or network error = fail
                        Dashboard.hideLoadingMsg();
                        showStatus(statusDiv, '✗ Connection failed', 'error');
                    });
                }

                // Helper function to show status messages
                function showStatus(element, message, type) {
                    element.textContent = message;
                    element.style.display = 'block';
                    if (type === 'success') {
                        element.style.backgroundColor = '#4caf50';
                        element.style.color = 'white';
                    } else {
                        element.style.backgroundColor = '#f44336';
                        element.style.color = 'white';
                    }
                }

                // Listen for the 'pageinit' event on this specific page.
                page.addEventListener('pageinit', function () {
                    console.log('AudioMuse AI config page initialized.');
                    
                    // Find the form and attach the submit listener.
                    const form = this.querySelector('.audiomuse-config-form');
                    form.addEventListener('submit', function (e) {
                        e.preventDefault();
                        saveConfig(this);
                        return false;
                    });

                    // Load the initial data.
                    loadConfig();
                });
            })();
        </script>
    </div>
</body>

</html>
